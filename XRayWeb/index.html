<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>X-Ray Cam Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: radiology lightbox — viewer panel beside (desktop) or above (phone) a control console. Single dark look by choice. */
:root {
  --bg: #070b12;
  --panel: #0d1420;
  --line: #1c2a3d;
  --fg: #dbe8f5;
  --dim: #7f93aa;
  --accent: #7fd4ff;
  --warn: #ffb35c;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } }

header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.note { color: var(--dim); font-size: 12px; margin: 0; }

.viewer { position: relative; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; max-height: 78vh; width: 100%; margin: 0 auto; }
@media (min-width: 821px) { .viewer { aspect-ratio: 4 / 5; } }
#view { width: 100%; height: 100%; object-fit: contain; display: block; }
.scan { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--ray) 9%, transparent) 0 1px, transparent 1px 5px); }
.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 14%; top: -14%;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--ray) 38%, transparent), transparent);
  animation: sweep 2.6s linear infinite alternate; }
@keyframes sweep { to { top: 100%; } }
@media (prefers-reduced-motion: reduce) { .scan::after { animation: none; top: 43%; } }
.readout { position: absolute; top: 10px; left: 10px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  background: rgba(0,0,0,.6); padding: 6px 10px; border-left: 2px solid var(--accent); color: var(--accent); font-variant-numeric: tabular-nums; }
.readout b { font-weight: 600; color: var(--fg); }
.stamp { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--dim);
  background: rgba(0,0,0,.6); padding: 2px 8px; white-space: nowrap; max-width: 95%; overflow: hidden; text-overflow: ellipsis; }

.console { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 18px; min-width: 0; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
button, .filebtn {
  font: 500 13px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 4px; padding: 10px 8px; cursor: pointer; text-align: center; min-height: 40px;
}
button:hover, .filebtn:hover { border-color: var(--accent); }
button:focus-visible, .filebtn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .4; cursor: not-allowed; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.status { font-size: 12px; color: var(--dim); min-height: 1.2em; margin: -8px 0 0; }
.status.warn { color: var(--warn); }

.group-title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { flex: 1 1 64px; padding: 8px 6px; min-height: 36px; }
.ctl { display: grid; gap: 6px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl output { font-family: var(--font-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 24px; }
.tints { display: flex; flex-wrap: wrap; gap: 6px; }
.tints button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; min-height: 34px; }
.tints button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
.row-end { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>

<div class="app">
  <header>
    <h1>X-Ray <span>Cam</span> Web</h1>
    <p class="note">Simulasi efek visual. Bukan sinar-X sungguhan.</p>
  </header>

  <div class="viewer" id="viewer">
    <canvas id="view" width="720" height="960" aria-label="Tampilan X-ray"></canvas>
    <div class="scan" id="scan"></div>
    <div class="readout" id="readout"></div>
    <div class="stamp" id="stamp">CONTOH · tangan buatan</div>
  </div>

  <section class="console" aria-label="Pengaturan">
    <div class="actions">
      <button class="primary" id="btnCam">Nyalakan Kamera</button>
      <label class="filebtn">Buka / Ambil Foto
        <input type="file" id="file" accept="image/*">
      </label>
      <button id="btnFlip" disabled>Balik Kamera</button>
      <button id="btnSave">Simpan Gambar</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <div>
      <p class="group-title">Preset tingkat</p>
      <div class="presets" id="presets">
        <button data-p="low">Rendah</button>
        <button data-p="mid">Sedang</button>
        <button data-p="high">Tinggi</button>
        <button data-p="max">Maks</button>
      </div>
    </div>

    <div class="ctl">
      <label for="intensity">Tingkat Ray <output id="o-intensity"></output></label>
      <input type="range" id="intensity" min="0" max="100" step="1">
    </div>
    <div class="ctl">
      <label for="penetration">Daya Tembus <output id="o-penetration"></output></label>
      <input type="range" id="penetration" min="0" max="100" step="1">
    </div>
    <div class="ctl">
      <label for="contrast">Kontras <output id="o-contrast"></output></label>
      <input type="range" id="contrast" min="50" max="300" step="1">
    </div>
    <div class="ctl">
      <label for="glow">Cahaya (Glow) <output id="o-glow"></output></label>
      <input type="range" id="glow" min="0" max="100" step="1">
    </div>

    <div>
      <p class="group-title">Warna ray</p>
      <div class="tints" id="tints"></div>
    </div>

    <div class="row-end">
      <label class="toggle"><input type="checkbox" id="scanline"> Efek garis pindai</label>
      <button id="btnReset">Reset</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const TINTS = {
    blue:   { label: "Biru Medis",   r: .72, g: .90, b: 1.0 },
    white:  { label: "Putih Klasik", r: 1.0, g: 1.0, b: 1.0 },
    green:  { label: "Hijau",        r: .55, g: 1.0, b: .60 },
    purple: { label: "Ungu",         r: .85, g: .65, b: 1.0 },
    amber:  { label: "Amber",        r: 1.0, g: .78, b: .40 },
  };
  const DEFAULTS = { intensity: 70, penetration: 40, contrast: 140, glow: 30, tint: "blue", scanline: true };
  const PRESETS = {
    low:  { intensity: 35,  penetration: 15, contrast: 110, glow: 10 },
    mid:  { intensity: 70,  penetration: 40, contrast: 140, glow: 30 },
    high: { intensity: 90,  penetration: 65, contrast: 190, glow: 55 },
    max:  { intensity: 100, penetration: 90, contrast: 260, glow: 85 },
  };
  const KEY = "xraycam-web-settings";
  const MAX_SIDE = 960;

  let S = { ...DEFAULTS };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (!TINTS[S.tint]) S.tint = DEFAULTS.tint;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const $ = (id) => document.getElementById(id);
  const view = $("view"), vctx = view.getContext("2d");
  const mk = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d", { willReadFrequently: true })]; };
  const [src, sctx] = mk();   // frame asli
  const [xc, xctx] = mk();    // hasil X-ray penuh
  const [gc, gctx] = mk();    // glow kecil

  // ---------- LUT: grayscale -> invert -> kontras -> daya tembus -> warna
  let lutR = new Uint8ClampedArray(256), lutG = new Uint8ClampedArray(256), lutB = new Uint8ClampedArray(256);
  function buildLut() {
    const c = S.contrast / 100, p = S.penetration / 100, t = TINTS[S.tint];
    for (let g = 0; g < 256; g++) {
      let v = (255 - g) * c + 128 * (1 - c);
      v = v * (1 + p * 0.9) - p * 150;
      lutR[g] = v * t.r; lutG[g] = v * t.g; lutB[g] = v * t.b;
    }
  }

  // ---------- sumber gambar
  let source = null;   // { el, w, h, mirror, live }
  let stream = null, facing = "environment", xImg = null;

  function sizeFor(w, h) {
    const k = Math.min(1, MAX_SIDE / Math.max(w, h));
    return [Math.round(w * k), Math.round(h * k)];
  }

  function render() {
    if (!source) return;
    const el = source.el;
    const nw = source.live ? el.videoWidth : source.w, nh = source.live ? el.videoHeight : source.h;
    if (!nw || !nh) return;
    const [w, h] = sizeFor(nw, nh);
    if (src.width !== w || src.height !== h) {
      for (const c of [view, src, xc]) { c.width = w; c.height = h; }
      xImg = null;
    }
    sctx.save();
    if (source.mirror) { sctx.translate(w, 0); sctx.scale(-1, 1); }
    sctx.drawImage(el, 0, 0, w, h);
    sctx.restore();

    const I = S.intensity / 100;
    vctx.globalCompositeOperation = "source-over";
    vctx.globalAlpha = 1;
    if (I < 1) vctx.drawImage(src, 0, 0); else { vctx.fillStyle = "#000"; vctx.fillRect(0, 0, w, h); }
    if (I > 0) {
      const d = sctx.getImageData(0, 0, w, h).data;
      if (!xImg) xImg = xctx.createImageData(w, h);
      const o = xImg.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = (54 * d[i] + 183 * d[i + 1] + 19 * d[i + 2]) >> 8;
        o[i] = lutR[g]; o[i + 1] = lutG[g]; o[i + 2] = lutB[g]; o[i + 3] = 255;
      }
      xctx.putImageData(xImg, 0, 0);
      vctx.globalAlpha = I;
      vctx.drawImage(xc, 0, 0);

      if (S.glow > 0) {
        const gw = Math.max(1, Math.round(w / 10)), gh = Math.max(1, Math.round(h / 10));
        if (gc.width !== gw || gc.height !== gh) { gc.width = gw; gc.height = gh; }
        gctx.drawImage(xc, 0, 0, gw, gh);
        const gi = gctx.getImageData(0, 0, gw, gh), gd = gi.data;
        for (let i = 0; i < gd.length; i += 4) {
          gd[i] = gd[i] * 2.2 - 170; gd[i + 1] = gd[i + 1] * 2.2 - 170; gd[i + 2] = gd[i + 2] * 2.2 - 170;
        }
        gctx.putImageData(gi, 0, 0);
        vctx.globalCompositeOperation = "lighter";
        vctx.globalAlpha = (S.glow / 100) * I;
        vctx.imageSmoothingEnabled = true; vctx.imageSmoothingQuality = "high";
        vctx.drawImage(gc, 0, 0, w, h);
      }
    }
    vctx.globalCompositeOperation = "source-over";
    vctx.globalAlpha = 1;
  }

  function loop() {
    if (!source || !source.live) return;
    render();
    requestAnimationFrame(loop);
  }

  // ---------- gambar contoh: tangan dengan tulang samar (muncul saat X-ray)
  function sampleHand() {
    const c = document.createElement("canvas"); c.width = 720; c.height = 960;
    const x = c.getContext("2d");
    const bg = x.createLinearGradient(0, 0, 0, 960);
    bg.addColorStop(0, "#c9c2b6"); bg.addColorStop(1, "#8f877b");
    x.fillStyle = bg; x.fillRect(0, 0, 720, 960);
    const skin = "#d9a27e", bone = "#c48c69";
    const fingers = [ // [x, y-top, panjang, sudut]
      [228, 330, 250, -0.10], [318, 250, 300, -0.03], [408, 262, 290, 0.03], [490, 330, 240, 0.10],
    ];
    x.lineCap = "round";
    // lengan + telapak
    x.fillStyle = skin;
    x.beginPath(); x.roundRect(250, 720, 230, 260, 40); x.fill();
    x.beginPath(); x.ellipse(362, 640, 175, 170, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = skin;
    for (const [fx, fy, len, a] of fingers) {
      x.save(); x.translate(fx, fy + len); x.rotate(a);
      x.lineWidth = 64; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -len); x.stroke(); x.restore();
    }
    // ibu jari
    x.save(); x.translate(230, 650); x.rotate(-0.9);
    x.lineWidth = 70; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -200); x.stroke(); x.restore();

    // tulang (sedikit lebih gelap dari kulit)
    x.strokeStyle = bone; x.fillStyle = bone;
    const seg = (x1, y1, x2, y2, wd) => { x.lineWidth = wd; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); };
    for (const [fx, fy, len, a] of fingers) {
      x.save(); x.translate(fx, fy + len); x.rotate(a);
      const parts = [0.40, 0.32, 0.24]; let y = 0;
      seg(0, 170, 0, 10, 24); // metakarpal
      for (const p of parts) { const l = len * p; seg(0, y - 8, 0, y - l + 10, 22 - p * 8); y -= l; }
      x.restore();
    }
    x.save(); x.translate(230, 650); x.rotate(-0.9);
    seg(0, 60, 0, -70, 26); seg(0, -90, 0, -180, 22); x.restore();
    for (let i = 0; i < 8; i++) { x.beginPath(); x.arc(300 + (i % 4) * 42, 770 + Math.floor(i / 4) * 40, 17, 0, Math.PI * 2); x.fill(); }
    seg(320, 840, 310, 990, 40); seg(410, 840, 420, 990, 34);
    return c;
  }

  function useImage(el, w, h, label) {
    stopCamera();
    source = { el, w, h, mirror: false, live: false };
    $("stamp").textContent = label;
    render();
  }

  // ---------- kamera
  async function startCamera() {
    const status = $("status");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Browser ini tidak mendukung kamera langsung. Pakai tombol Buka / Ambil Foto.", true);
      return;
    }
    try {
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
      });
      const v = document.createElement("video");
      v.playsInline = true; v.muted = true; v.srcObject = stream;
      await v.play();
      source = { el: v, live: true, mirror: facing === "user" };
      $("stamp").textContent = "LANGSUNG · kamera " + (facing === "user" ? "depan" : "belakang");
      $("btnCam").textContent = "Matikan Kamera";
      $("btnFlip").disabled = false;
      setStatus("");
      loop();
    } catch (e) {
      stream = null;
      setStatus("Kamera tidak bisa dibuka di halaman ini (izin ditolak atau tidak tersedia). Pakai Buka / Ambil Foto.", true);
    }
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    const wasLive = source && source.live;
    stream = null;
    if (wasLive) source = null;
    $("btnCam").textContent = "Nyalakan Kamera";
    $("btnFlip").disabled = true;
  }
  function setStatus(msg, warn) { const s = $("status"); s.textContent = msg; s.classList.toggle("warn", !!warn); }

  $("btnCam").addEventListener("click", () => {
    if (stream) { stopCamera(); useImage(sample, sample.width, sample.height, "CONTOH · tangan buatan"); }
    else startCamera();
  });
  $("btnFlip").addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; startCamera(); });

  $("file").addEventListener("change", (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { useImage(img, img.naturalWidth, img.naturalHeight, "FOTO · " + f.name); setStatus(""); };
    img.onerror = () => setStatus("File ini tidak bisa dibuka sebagai gambar.", true);
    img.src = url;
    ev.target.value = "";
  });

  // ---------- simpan
  $("btnSave").addEventListener("click", () => {
    view.toBlob(async (blob) => {
      if (!blob) { setStatus("Gagal membuat gambar.", true); return; }
      const filename = "xray-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".png";
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use("downloads");
        if (!dl) { setStatus("Menyimpan tidak tersedia di tampilan ini.", true); return; }
        try { await dl.save({ filename, data: blob }); setStatus("Gambar disimpan: " + filename); }
        catch (e) { setStatus(e && e.code === "declined" ? "Penyimpanan dibatalkan." : "Gambar tidak bisa disimpan di sini.", e && e.code !== "declined"); }
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      setStatus("Gambar disimpan: " + filename);
    }, "image/png");
  });

  // ---------- kontrol
  const sliders = ["intensity", "penetration", "contrast", "glow"];
  const tintBox = $("tints");
  for (const [k, t] of Object.entries(TINTS)) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.tint = k;
    const sw = document.createElement("span");
    sw.className = "swatch"; sw.style.background = `rgb(${t.r * 255},${t.g * 255},${t.b * 255})`;
    b.append(sw, document.createTextNode(t.label));
    b.addEventListener("click", () => update({ tint: k }));
    tintBox.appendChild(b);
  }

  function levelName(i) { return i === 0 ? "MATI" : i < 40 ? "RENDAH" : i < 75 ? "SEDANG" : i < 95 ? "TINGGI" : "MAKS"; }

  function syncUi() {
    for (const k of sliders) $(k).value = S[k];
    $("o-intensity").textContent = S.intensity + "%";
    $("o-penetration").textContent = S.penetration + "% · ≈" + Math.round(40 + S.penetration * 1.1) + " kVp";
    $("o-contrast").textContent = S.contrast + "%";
    $("o-glow").textContent = S.glow + "%";
    for (const b of tintBox.children) b.setAttribute("aria-pressed", String(b.dataset.tint === S.tint));
    $("scanline").checked = S.scanline;
    const t = TINTS[S.tint];
    document.documentElement.style.setProperty("--ray", `rgb(${t.r * 255},${t.g * 255},${t.b * 255})`);
    $("scan").hidden = !(S.scanline && S.intensity > 0);
    const r = $("readout");
    r.replaceChildren();
    const l1 = document.createElement("div"); l1.append("RAY ");
    const b1 = document.createElement("b"); b1.textContent = levelName(S.intensity) + " " + S.intensity + "%"; l1.append(b1);
    const l2 = document.createElement("div");
    l2.textContent = "≈" + Math.round(40 + S.penetration * 1.1) + " kVp · kontras " + S.contrast + "%";
    r.append(l1, l2);
  }

  function update(patch) {
    Object.assign(S, patch);
    buildLut(); syncUi(); save();
    if (source && !source.live) render();
  }

  for (const k of sliders) $(k).addEventListener("input", (e) => update({ [k]: Number(e.target.value) }));
  $("scanline").addEventListener("change", (e) => update({ scanline: e.target.checked }));
  $("presets").addEventListener("click", (e) => { const p = e.target.closest("button"); if (p) update(PRESETS[p.dataset.p]); });
  $("btnReset").addEventListener("click", () => update({ ...DEFAULTS }));

  // ---------- mulai
  const sample = sampleHand();
  buildLut(); syncUi();
  useImage(sample, sample.width, sample.height, "CONTOH · tangan buatan");
  addEventListener("pagehide", stopCamera);
})();
</script>

</body>
</html>
